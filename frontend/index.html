<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Money Custody Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>MONEY TRACKER</h1>

      <section id="people-section">
        <div class="header">
          <h2>People</h2>
          <form id="add-person-form">
            <input name="name" placeholder="Name" required />
            <input name="phone" placeholder="Phone (optional)" />
            <input name="email" placeholder="Email (optional)" />
            <button type="submit">Add Person</button>
          </form>
        </div>
        <ul id="people-list"></ul>
      </section>

      <section id="person-detail" class="card hidden">
        <button id="back-to-people" class="link">← Back</button>
        <h2 id="detail-name"></h2>
        <div id="summary" class="summary"></div>

        <div class="txn-area">
          <form id="add-transaction-form" class="txn-form">
            <label>Type</label>
            <select name="type" required>
              <option value="received">Money Received</option>
              <option value="returned">Money Sent Back</option>
            </select>
            <label>Amount (₦)</label>
            <input name="amount" type="number" step="0.01" required />
            <label>Date</label>
            <input name="date" type="date" required />
            <label>Description</label>
            <input name="description" />
            <button type="submit">Add Transaction</button>
          </form>

          <h3>Transactions</h3>
          <div id="transactions-list"></div>
        </div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
